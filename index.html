<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>分时图片</title>
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1014'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e9b45f' stroke-width='2'/%3E%3Cpath d='M16 10.5v6.2l4.2 2.6' stroke='%23e9b45f' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #080a0d;
  }

  .stage { position: fixed; inset: 0; }

  /* 四张图叠放，按时间淡入淡出 */
  .slide {
    position: absolute;
    inset: 0;
    margin: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity .6s ease, visibility .6s step-end;
  }
  .slide.is-on {
    opacity: 1;
    visibility: visible;
    z-index: 2;
    transition: opacity .6s ease, visibility 0s;
  }

  .slide img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .2s ease; }
  }
</style>
</head>
<body>

<main class="stage">

  <!-- 05:00 – 05:59 -->
  <figure class="slide" data-slot="1">
    <img src="assets/1.jpg" alt="" decoding="async" fetchpriority="high" />
  </figure>

  <!-- 06:00 – 16:59 -->
  <figure class="slide" data-slot="2">
    <img src="assets/2.jpg" alt="" decoding="async" />
  </figure>

  <!-- 17:00 – 17:59 -->
  <figure class="slide" data-slot="3">
    <img src="assets/3.jpg" alt="" decoding="async" />
  </figure>

  <!-- 18:00 – 次日 04:59 -->
  <figure class="slide" data-slot="4">
    <img src="assets/4.jpg" alt="" decoding="async" />
  </figure>

</main>

<script>
(function () {
  "use strict";

  /* 排期配置：start / end 为整点小时（end 不含），wrap 表示跨零点 */
  var RULES = [
    { start: 5,  end: 6,  slot: 1 },
    { start: 6,  end: 17, slot: 2 },
    { start: 17, end: 18, slot: 3 },
    { start: 18, end: 5,  slot: 4, wrap: true }
  ];

  var slides = {};
  Array.prototype.forEach.call(document.querySelectorAll(".slide"), function (el) {
    slides[el.dataset.slot] = el;
  });

  // 统一按北京时间（UTC+8）判断
  function minuteOfDay() {
    var d = new Date();
    var z = new Date(d.getTime() + 8 * 3600000);
    return z.getUTCHours() * 60 + z.getUTCMinutes();
  }

  function activeSlot(min) {
    for (var i = 0; i < RULES.length; i++) {
      var r = RULES[i];
      var s = r.start * 60;
      var e = r.end * 60;
      var hit = r.wrap ? (min >= s || min < e) : (min >= s && min < e);
      if (hit) return r.slot;
    }
    return null;
  }

  var current = null;

  function render() {
    var slot = activeSlot(minuteOfDay());
    if (slot === current) return;
    current = slot;
    Object.keys(slides).forEach(function (key) {
      slides[key].classList.toggle("is-on", Number(key) === slot);
    });
  }

  render();
  setInterval(render, 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) render();
  });
})();
</script>
</body>
</html>
